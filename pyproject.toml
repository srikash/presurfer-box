[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presurfer"
version = "1.0.0"
description = "MATLAB-free presurfer modules using SPM Standalone in Docker"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "nibabel>=5.0",
    "numpy>=1.24",
    "rich>=15.0.0",
]

[project.scripts]
presurfer-box = "presurfer.command_line:main"

[tool.setuptools]
packages = ["presurfer", "scripts"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TRY", "PL"]
ignore = ["E501", "PLC0415", "PLR0913", "TRY003", "UP031"]

[tool.mypy]
python_version = "3.13"
files = ["presurfer", "scripts"]
exclude = ["^\\.venv/"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
