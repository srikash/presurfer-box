[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "presurfer"
version = "2.4.11"
description = "MATLAB-free MP2RAGE preprocessing using SPM Standalone containers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sriranga Kashyap" }]
keywords = ["MRI", "MP2RAGE", "SPM", "neuroimaging", "presurfer", "Docker", "Apptainer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "nibabel>=5.0",
    "numpy>=1.24",
    "rich>=15.0.0",
]

[project.scripts]
presurfer = "presurfer.command_line:main"
presurfer-box = "presurfer.command_line:main"

[project.urls]
Homepage = "https://github.com/srikash/presurfer-box"
Source = "https://github.com/srikash/presurfer-box"
Issues = "https://github.com/srikash/presurfer-box/issues"
Citation = "https://doi.org/10.5281/zenodo.22163094"

[tool.setuptools]
packages = ["presurfer"]

[tool.setuptools.package-data]
presurfer = ["py.typed"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TRY", "PL"]
ignore = ["E501", "PLC0415", "PLR0913", "TRY003", "UP031"]

[tool.mypy]
python_version = "3.13"
files = ["presurfer", "scripts"]
exclude = ["^\\.venv/"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
