[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presurfer"
version = "0.1.0"
description = "MATLAB-free presurfer modules using SPM Standalone in Docker"
requires-python = ">=3.10"
dependencies = ["nibabel>=5.0", "numpy>=1.24"]

[project.scripts]
presurfer-box = "scripts.presurfer_box:main"

[tool.setuptools]
packages = ["presurfer", "scripts"]
